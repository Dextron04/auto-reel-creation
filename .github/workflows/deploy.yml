name: Deploy Reel Automation

on:
  push:
    branches:
      - main
    paths:
      - "renderer/**"
      - "dashboard/**"
      - "n8n/workflows/**"
      - "scripts/**"
      - "docker-compose.yml"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: auto-reel-creation-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to mac-agent
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - auto-reel-creation
    timeout-minutes: 20

    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@v4

      - name: Update production checkout
        env:
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"

          "$GITHUB_WORKSPACE/scripts/update-production-checkout.sh" "$HOME/auto-reel-creation" main

      - name: Test, rebuild, and verify
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$HOME/auto-reel-creation"
          ./scripts/deploy-server.sh

      - name: Report deployed commit
        run: |
          cd "$HOME/auto-reel-creation"
          echo "Deployed $(git rev-parse --short HEAD) to https://reels-dashboard.dextron04.in"
