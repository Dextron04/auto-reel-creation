services:
  n8n:
    image: n8nio/n8n:latest
    env_file:
      - .env.prod
    ports: ["127.0.0.1:5678:5678"]
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_HOST=localhost
      - GENERIC_TIMEZONE=America/Chicago
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/media;/output
    volumes:
      - n8n_data:/home/node/.n8n
      - ./media:/media
      - ./output:/output
  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    ports: ["127.0.0.1:8888:8080"]
  renderer:
    build: ./renderer
    env_file:
      - .env.prod
    environment:
      - SEARXNG_URL=http://searxng:8080
    ports: ["127.0.0.1:3001:3001"]
    volumes:
      - ./media:/media
      - ./output:/output
    depends_on:
      - searxng
  dashboard:
    build: ./dashboard
    env_file:
      - .env.prod
    environment:
      - DASHBOARD_PORT=4000
      - N8N_BASE_URL=http://n8n:5678
      - RENDERER_URL_PUBLIC=http://renderer:3001
    ports: ["127.0.0.1:4000:4000"]
    volumes:
      - ./output:/app/output:ro
      - ./n8n/workflows:/app/n8n/workflows:ro
      - ./GATES.md:/app/GATES.md:ro
    depends_on:
      - n8n
      - renderer

volumes:
  n8n_data:
