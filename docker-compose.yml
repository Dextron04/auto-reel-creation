services:
  n8n:
    image: n8nio/n8n:latest
    env_file:
      - .env.prod
    ports: ["127.0.0.1:5678:5678"]
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_HOST=localhost
      - GENERIC_TIMEZONE=America/Chicago
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/media;/output
    volumes:
      - n8n_data:/home/node/.n8n
      - ./media:/media
      - ./output:/output
  renderer:
    build: ./renderer
    # x64: fortress (image search) has no native linux-arm64 binary yet, and its Docker fallback spawns a
    # sibling container that's unreachable from inside renderer's own network namespace. Emulated under
    # QEMU on Apple Silicon, so ffmpeg/chromium/remotion render slower than a native arm64 image would.
    platform: linux/amd64
    env_file:
      - .env.prod
    ports: ["127.0.0.1:3001:3001"]
    volumes:
      - ./media:/media
      - ./output:/output
  dashboard:
    build: ./dashboard
    env_file:
      - .env.prod
    environment:
      - DASHBOARD_PORT=4000
      - N8N_BASE_URL=http://n8n:5678
      - RENDERER_URL_PUBLIC=http://renderer:3001
    ports: ["127.0.0.1:4000:4000"]
    volumes:
      - ./output:/app/output:ro
      - ./n8n/workflows:/app/n8n/workflows:ro
      - ./GATES.md:/app/GATES.md:ro
    depends_on:
      - n8n
      - renderer

volumes:
  n8n_data:
