<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>Reel Operations</title>
<style>
  :root {
    --canvas: #f4f6f3; --paper: #fff; --ink: #17201d; --muted: #68736e;
    --line: #dce2de; --line-strong: #c8d0cb; --green: #1d6b4f;
    --green-soft: #e6f1ec; --amber: #a86017; --red: #b64343;
    --blue: #315d82; --font: "Avenir Next", Avenir, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid rgba(49,93,130,.24); outline-offset: 2px; }
  .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 44px 0 72px; }
  .masthead { display: grid; grid-template-columns: minmax(0,1fr) minmax(260px,auto); gap: 32px; align-items: end; padding-bottom: 24px; border-bottom: 1px solid var(--line-strong); }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .brand-mark { width: 18px; height: 18px; color: var(--green); }
  h1 { margin: 12px 0 0; font-size: clamp(30px,4vw,48px); line-height: 1.04; letter-spacing: -.04em; font-weight: 600; }
  .updated { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
  .next-run { text-align: right; }
  .next-label { color: var(--muted); font-size: 13px; }
  .next-time { margin-top: 4px; font-size: clamp(22px,3vw,31px); font-weight: 600; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
  .next-detail { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .service-strip { display: flex; flex-wrap: wrap; gap: 8px 24px; padding: 15px 0; border-bottom: 1px solid var(--line); }
  .service { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .service-state { color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
  .dot.good { background: var(--green); } .dot.bad { background: var(--red); } .dot.warn { background: var(--amber); }
  #banners { margin-top: 18px; }
  .banner { padding: 10px 12px; border-left: 3px solid; background: var(--paper); font-size: 13px; margin-bottom: 8px; }
  .banner.bad { border-color: var(--red); } .banner.warn { border-color: var(--amber); } .banner.info { border-color: var(--blue); }
  main { display: grid; gap: 44px; margin-top: 38px; }
  .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
  .run-heading { align-items: center; }
  .run-action { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .run-message { max-width: 32ch; color: var(--muted); font-size: 12px; text-align: right; }
  .run-button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
  .run-button svg { width: 14px; height: 14px; }
  h2 { margin: 0; font-size: 19px; letter-spacing: -.015em; font-weight: 600; }
  .section-meta { color: var(--muted); font-size: 13px; }
  .running-list { background: var(--paper); border: 1px solid var(--line); }
  .run-card { display: grid; grid-template-columns: minmax(160px,.55fr) minmax(260px,1.45fr) auto; gap: 24px; align-items: center; padding: 17px 18px; border-bottom: 1px solid var(--line); }
  .run-card:last-child { border-bottom: 0; }
  .run-id { display: flex; align-items: center; gap: 9px; font-weight: 600; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 5px var(--green-soft); }
  .node-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .node { padding: 4px 8px; background: var(--green-soft); color: var(--green); font-size: 12px; font-weight: 600; }
  .elapsed { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  .empty { padding: 28px 18px; background: var(--paper); border: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  .table-frame { overflow: hidden; background: var(--paper); border: 1px solid var(--line); }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-size: 12px; font-weight: 500; padding: 11px 14px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
  td { padding: 13px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; } tbody tr:hover { background: #fafbfa; }
  .mono { font-family: var(--mono); font-size: 12px; } .muted { color: var(--muted); }
  .numeric { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status.success { color: var(--green); } .status.error, .status.crashed { color: var(--red); }
  .status.running, .status.new, .status.waiting { color: var(--blue); } .status.canceled { color: var(--amber); }
  .error-text { color: var(--red); display: block; margin-top: 3px; max-width: 45ch; }
  .table-footer { display: flex; justify-content: center; padding: 12px; border-top: 1px solid var(--line); }
  .mobile-list { display: none; }
  button { border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink); padding: 8px 12px; cursor: pointer; border-radius: 4px; }
  button:hover { border-color: var(--ink); } button:disabled { opacity: .55; cursor: wait; }
  button.primary { background: var(--ink); color: white; border-color: var(--ink); font-weight: 600; }
  .text-button { border: 0; padding: 0; color: var(--blue); background: transparent; }
  .secondary-grid { display: grid; grid-template-columns: minmax(0,.8fr) minmax(0,1.2fr); gap: 24px; align-items: start; }
  .utility { background: var(--paper); border: 1px solid var(--line); padding: 20px; }
  .utility h2 { margin-bottom: 18px; }
  .preset-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .preset { font-size: 12px; padding: 5px 8px; }
  .schedule-row { display: flex; gap: 8px; }
  input[type="text"] { min-width: 0; flex: 1; border: 1px solid var(--line-strong); background: var(--canvas); color: var(--ink); padding: 8px 10px; border-radius: 4px; font: 13px var(--mono); }
  .schedule-source, #scheduleMsg { color: var(--muted); font-size: 12px; margin-top: 9px; }
  .good-text { color: var(--green); } .bad-text { color: var(--red); } .warn-text { color: var(--amber); }
  video { display: block; width: 100%; max-width: 420px; margin-top: 8px; background: #000; }
  @media (max-width: 760px) {
    .shell { width: 100%; padding: 18px 14px 48px; }
    .masthead { grid-template-columns: 1fr; gap: 16px; padding: 0 0 16px; }
    .brand { font-size: 12px; }
    h1 { margin-top: 8px; font-size: 32px; }
    .updated { margin-top: 5px; font-size: 12px; }
    .next-run { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 12px; text-align: left; padding: 13px 0 0; border-top: 1px solid var(--line); }
    .next-label { font-size: 12px; }
    .next-time { grid-column: 1 / -1; font-size: 24px; }
    .next-detail { grid-column: 1 / -1; margin: 0; }
    .service-strip { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 0 18px; padding: 7px 0; }
    .service { min-height: 44px; border-bottom: 1px solid var(--line); }
    .service:nth-last-child(-n+2) { border-bottom: 0; }
    .service-state { font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
    #banners { margin-top: 12px; }
    .banner { padding: 9px 10px; margin-bottom: 6px; line-height: 1.35; }
    main { gap: 30px; margin-top: 26px; }
    .section-heading { margin-bottom: 10px; }
    .run-heading { display: grid; grid-template-columns: 1fr auto; align-items: center; }
    .run-action { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr; gap: 7px; margin-top: 4px; }
    .run-message { max-width: none; text-align: left; }
    .run-button { width: 100%; min-height: 48px; }
    h2 { font-size: 18px; }
    .run-card { grid-template-columns: 1fr auto; gap: 8px 12px; min-height: 68px; padding: 14px; }
    .node-list { grid-column: 1 / -1; }
    .elapsed { grid-column: 2; grid-row: 1; }
    .secondary-grid { grid-template-columns: 1fr; gap: 30px; }
    .utility { margin-inline: -14px; padding: 18px 14px; border-left: 0; border-right: 0; }
    .preset-row { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .preset { min-height: 44px; padding: 8px; }
    .schedule-row { display: grid; grid-template-columns: 1fr; }
    input[type="text"], button.primary { min-height: 46px; width: 100%; }
    .desktop-only { display: none; }
    .mobile-list { display: block; margin-inline: -14px; background: var(--paper); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .mobile-record { border-bottom: 1px solid var(--line); }
    .mobile-record:last-child { border-bottom: 0; }
    .mobile-record summary { position: relative; min-height: 72px; padding: 13px 42px 13px 14px; cursor: pointer; list-style: none; }
    .mobile-record summary::-webkit-details-marker { display: none; }
    .mobile-record summary::after { content: "+"; position: absolute; right: 15px; top: 50%; translate: 0 -50%; color: var(--muted); font-size: 20px; font-weight: 300; }
    .mobile-record[open] summary::after { content: "−"; }
    .mobile-record[open] summary { background: #fafbfa; }
    .record-line { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    .record-line time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .record-node { display: block; margin-top: 7px; overflow: hidden; color: var(--muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .record-details { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 8px 12px; margin: 0; padding: 14px; border-top: 1px solid var(--line); background: var(--canvas); font-size: 13px; }
    .record-details dt { color: var(--muted); }
    .record-details dd { margin: 0; overflow-wrap: anywhere; }
    .record-details .record-error { color: var(--red); }
    .table-footer { margin-inline: -14px; min-height: 58px; background: var(--paper); }
    .table-footer button { width: calc(100% - 28px); min-height: 44px; }
    .video-record summary { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; }
    .record-file { overflow: hidden; font: 12px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .record-duration { color: var(--muted); font-size: 12px; }
    .video-details { padding: 0 14px 14px; color: var(--muted); font-size: 12px; }
    .video-details video { margin-top: 12px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .pulse { animation: breathe 2.2s ease-in-out infinite; }
    @keyframes breathe { 50% { box-shadow: 0 0 0 8px rgba(29,107,79,.08); } }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div>
      <div class="brand"><svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M3 3h5v5H3V3Zm9 0h5v5h-5V3ZM3 12h5v5H3v-5Zm9 0h5v5h-5v-5Z"/></svg>Reel automation</div>
      <h1>Operations</h1>
      <p class="updated" id="lastUpdated">Connecting to services…</p>
    </div>
    <div class="next-run" aria-live="polite">
      <div class="next-label">Next scheduled run</div>
      <div class="next-time" id="nextRunTime">—</div>
      <div class="next-detail" id="nextRunDetail">Loading schedule…</div>
    </div>
  </header>
  <div class="service-strip" id="services" aria-label="Service health"></div>
  <div id="banners"></div>
  <main>
    <section aria-labelledby="running-title">
      <div class="section-heading run-heading">
        <h2 id="running-title">Running now</h2><span class="section-meta" id="runningCount">Checking activity…</span>
        <div class="run-action">
          <span class="run-message" id="manualRunMessage" aria-live="polite">Checking workflow activity…</span>
          <button class="primary run-button" id="runWorkflow" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 2.7v10.6c0 .7.8 1.1 1.4.7l8-5.3a.83.83 0 0 0 0-1.4l-8-5.3c-.6-.4-1.4 0-1.4.7Z"/></svg><span>Run workflow</span></button>
        </div>
      </div>
      <div id="running"><div class="empty">Loading active executions…</div></div>
    </section>
    <section aria-labelledby="executions-title">
      <div class="section-heading"><h2 id="executions-title">All executions</h2><span class="section-meta" id="executionCount"></span></div>
      <div id="executions"><div class="empty">Loading execution history…</div></div>
    </section>
    <div class="secondary-grid">
      <section class="utility" aria-labelledby="schedule-title">
        <h2 id="schedule-title">Schedule</h2>
        <div class="preset-row">
          <button class="preset" data-cron="0 9,17 * * *">9am and 5pm</button><button class="preset" data-cron="0 9 * * *">Daily at 9am</button>
          <button class="preset" data-cron="0 */6 * * *">Every 6 hours</button><button class="preset" data-cron="0 */4 * * *">Every 4 hours</button>
        </div>
        <div class="schedule-row"><input type="text" id="cronInput" aria-label="Cron schedule" placeholder="0 9,17 * * *" /><button class="primary" id="saveSchedule">Save</button></div>
        <div class="schedule-source" id="scheduleSource"></div><div id="scheduleMsg" aria-live="polite"></div>
      </section>
      <section class="utility" aria-labelledby="videos-title">
        <div class="section-heading"><h2 id="videos-title">Released videos</h2><span class="section-meta" id="videoCount"></span></div>
        <div id="videos"><div class="empty">Loading rendered videos…</div></div>
      </section>
    </div>
  </main>
</div>
<script type="module">
import {executionDisclosure, manualRunPresentation, videoDisclosure} from './presenters.mjs';
const $ = (selector, element = document) => element.querySelector(selector);
const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[character]);
const fmtBytes = bytes => bytes == null ? '—' : `${(bytes / 1024 / 1024).toFixed(1)} MB`;
const fmtDate = value => value ? new Date(value).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}) : '—';
const fmtDuration = seconds => seconds == null ? '—' : `${seconds.toFixed(1)}s`;
const durationBetween = (start, stop = new Date()) => {
  if (!start) return '—';
  const seconds = Math.max(0, Math.floor((new Date(stop) - new Date(start)) / 1000));
  if (seconds < 60) return `${seconds}s`;
  const minutes = Math.floor(seconds / 60);
  return seconds < 3600 ? `${minutes}m ${seconds % 60}s` : `${Math.floor(minutes / 60)}h ${minutes % 60}m`;
};
let executionRows = [], nextExecutionCursor = null, nextRunAt = null, nextRunLabel = null, historyExpanded = false, manualRunStarting = false, manualRunError = null;
async function getJSON(url, options) {
  const response = await fetch(url, options); const body = await response.json().catch(() => ({}));
  if (!response.ok) throw Object.assign(new Error(body.error || response.statusText), {body}); return body;
}
function service(name, ok, state) { return `<div class="service"><span class="dot ${ok ? 'good' : 'bad'}"></span><span>${escapeHtml(name)}</span><span class="service-state">${escapeHtml(state)}</span></div>`; }
async function loadStatus() {
  const status = await getJSON('/api/status'), workflow = status.n8n.workflow;
  $('#services').innerHTML = [
    service('Renderer', status.renderer.ok, status.renderer.ok ? 'Online' : 'Offline'), service('n8n', status.n8n.ok, status.n8n.ok ? 'Online' : 'Offline'),
    `<div class="service"><span class="dot ${workflow?.active ? 'good' : 'warn'}"></span><span>Workflow</span><span class="service-state">${workflow ? (workflow.active ? 'Active' : 'Paused') : 'Unknown'}</span></div>`,
    `<div class="service"><span class="dot ${status.n8n.apiConfigured ? 'good' : 'warn'}"></span><span>API</span><span class="service-state">${status.n8n.apiConfigured ? 'Connected' : 'Not configured'}</span></div>`,
  ].join('');
  const banners = [...(status.envWarnings ?? [])]; if (status.n8n.error) banners.push({level:'bad',message:`n8n API error: ${status.n8n.error}`});
  $('#banners').innerHTML = banners.map(warning => `<div class="banner ${escapeHtml(warning.level ?? 'warn')}">${escapeHtml(warning.message)}</div>`).join('');
  $('#lastUpdated').textContent = `Updated ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})}`;
}
function renderNextRun() {
  if (!nextRunAt) return; const next = new Date(nextRunAt), difference = next - new Date();
  $('#nextRunTime').textContent = nextRunLabel ?? '—';
  $('#nextRunDetail').textContent = difference > 0 ? `in ${durationBetween(new Date(), next)}` : 'Schedule refreshing…';
}
async function loadSchedule() {
  try {
    const schedule = await getJSON('/api/schedule'); $('#cronInput').value = schedule.cron ?? ''; nextRunAt = schedule.nextRunAt; nextRunLabel = schedule.nextRunLabel;
    if (schedule.active === false) { $('#nextRunTime').textContent = 'Paused'; $('#nextRunDetail').textContent = 'Activate the workflow to resume scheduled runs'; }
    else if (nextRunAt) renderNextRun();
    else { $('#nextRunTime').textContent = 'Unavailable'; $('#nextRunDetail').textContent = 'Check the configured cron expression'; }
    $('#scheduleSource').textContent = `${schedule.source === 'n8n' ? 'Live n8n schedule' : 'Checked-in workflow schedule'} · ${schedule.timezone}`;
  } catch (error) { $('#nextRunTime').textContent = 'Unavailable'; $('#nextRunDetail').textContent = error.message; }
}
function renderRunning(rows) {
  const active = rows.filter(execution => execution.status === 'running');
  $('#runningCount').textContent = active.length === 1 ? '1 active execution' : `${active.length} active executions`;
  if (!active.length) { $('#running').innerHTML = '<div class="empty">No nodes are running. The next execution will appear here as it starts.</div>'; return; }
  $('#running').innerHTML = `<div class="running-list">${active.map(execution => {
    const nodes = execution.currentNodes.length ? execution.currentNodes : [execution.lastNode ?? 'Starting workflow'];
    return `<article class="run-card"><div class="run-id"><span class="pulse"></span>Execution ${escapeHtml(execution.id)}</div><div class="node-list">${nodes.map(node => `<span class="node">${escapeHtml(node)}</span>`).join('')}</div><div class="elapsed" data-started="${escapeHtml(execution.startedAt)}">${durationBetween(execution.startedAt)}</div></article>`;
  }).join('')}</div>`;
}
function renderManualRunControl() {
  const runningExecution = executionRows.find(execution => execution.status === 'running');
  const view = manualRunPresentation({runningExecutionId: runningExecution?.id ?? null, starting: manualRunStarting, error: manualRunError});
  const button = $('#runWorkflow');
  button.disabled = view.disabled;
  button.querySelector('span').textContent = view.label;
  $('#manualRunMessage').innerHTML = view.error ? `<span class="bad-text">${escapeHtml(view.message)}</span>` : escapeHtml(view.message);
}
function statusLabel(status) {
  const label = status === 'success' ? 'Succeeded' : status === 'error' ? 'Failed' : status.charAt(0).toUpperCase() + status.slice(1);
  return `<span class="status ${escapeHtml(status)}">${escapeHtml(label)}</span>`;
}
function renderExecutions() {
  $('#executionCount').textContent = `${executionRows.length} loaded`;
  if (!executionRows.length) { $('#executions').innerHTML = '<div class="empty">No executions yet.</div>'; return; }
  const mobileRows = executionRows.map(execution => executionDisclosure({
    status: execution.status,
    statusLabel: execution.status === 'success' ? 'Succeeded' : execution.status === 'error' ? 'Failed' : execution.status.charAt(0).toUpperCase() + execution.status.slice(1),
    started: new Date(execution.startedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}),
    duration: durationBetween(execution.startedAt, execution.stoppedAt || new Date()),
    mode: execution.mode ? execution.mode.charAt(0).toUpperCase() + execution.mode.slice(1) : '—',
    node: execution.currentNodes[0] ?? execution.lastNode,
    error: execution.error,
    id: execution.id,
  })).join('');
  $('#executions').innerHTML = `<div class="table-frame desktop-only"><div class="table-scroll"><table><thead><tr><th>Status</th><th>Started</th><th>Duration</th><th>Mode</th><th>Node</th><th>Execution</th></tr></thead><tbody>${executionRows.map(execution => `<tr><td>${statusLabel(execution.status)}</td><td class="numeric">${escapeHtml(fmtDate(execution.startedAt))}</td><td class="numeric">${escapeHtml(durationBetween(execution.startedAt, execution.stoppedAt || new Date()))}</td><td>${escapeHtml(execution.mode ?? '—')}</td><td>${escapeHtml(execution.currentNodes[0] ?? execution.lastNode ?? '—')}${execution.error ? `<span class="error-text">${escapeHtml(execution.error)}</span>` : ''}</td><td class="mono muted">#${escapeHtml(execution.id)}</td></tr>`).join('')}</tbody></table></div></div><div class="mobile-list">${mobileRows}</div>${nextExecutionCursor ? '<div class="table-footer"><button id="loadMore">Load older executions</button></div>' : ''}`;
  $('#loadMore')?.addEventListener('click', () => loadExecutions(false));
}
async function loadExecutions(reset = true) {
  const button = $('#loadMore'); if (button) { button.disabled = true; button.textContent = 'Loading…'; }
  const cursor = reset ? null : nextExecutionCursor, data = await getJSON(`/api/executions${cursor ? `?cursor=${encodeURIComponent(cursor)}` : ''}`);
  if (!data.configured) { $('#runningCount').textContent = 'API not configured'; $('#running').innerHTML = '<div class="empty">Connect N8N_API_KEY to see live nodes.</div>'; $('#executions').innerHTML = '<div class="empty">Connect N8N_API_KEY to see execution history.</div>'; return; }
  if (data.error) throw new Error(data.error);
  if (reset) {
    const latestIds = new Set(data.executions.map(execution => execution.id));
    executionRows = historyExpanded
      ? [...data.executions, ...executionRows.filter(execution => !latestIds.has(execution.id))]
      : data.executions;
    if (!historyExpanded) nextExecutionCursor = data.nextCursor;
  } else {
    const existingIds = new Set(executionRows.map(execution => execution.id));
    executionRows = [...executionRows, ...data.executions.filter(execution => !existingIds.has(execution.id))];
    nextExecutionCursor = data.nextCursor;
    historyExpanded = true;
  }
  renderRunning(data.executions); renderExecutions();
  renderManualRunControl();
}
document.querySelectorAll('.preset').forEach(button => button.addEventListener('click', () => { $('#cronInput').value = button.dataset.cron; }));
$('#saveSchedule').addEventListener('click', async () => {
  const cron = $('#cronInput').value.trim(), message = $('#scheduleMsg'); message.textContent = 'Saving…';
  try {
    const result = await getJSON('/api/schedule', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cron})});
    message.innerHTML = `<span class="good-text">Schedule saved.</span>${result.fileWarning ? `<br><span class="warn-text">${escapeHtml(result.fileWarning)}</span>` : ''}`;
    await Promise.all([loadSchedule(),loadStatus()]);
  } catch (error) { message.innerHTML = `<span class="bad-text">${escapeHtml(error.message)}</span>`; }
});
$('#runWorkflow').addEventListener('click', async () => {
  if (manualRunStarting) return;
  manualRunStarting = true;
  manualRunError = null;
  renderManualRunControl();
  try {
    await getJSON('/api/run', {method:'POST'});
    for (let attempt = 0; attempt < 5; attempt += 1) {
      await new Promise(resolve => setTimeout(resolve, 700));
      await loadExecutions(true);
      if (executionRows.some(execution => execution.status === 'running')) break;
    }
  } catch (error) {
    manualRunError = error.message;
  } finally {
    manualRunStarting = false;
    renderManualRunControl();
  }
});
async function loadVideos() {
  const videos = await getJSON('/api/videos'); $('#videoCount').textContent = `${videos.length} released`;
  if (!videos.length) { $('#videos').innerHTML = '<div class="empty">No rendered videos yet.</div>'; return; }
  const mobileRows = videos.map(video => videoDisclosure({file:video.file,created:fmtDate(video.createdAt),duration:fmtDuration(video.durationSeconds),size:fmtBytes(video.sizeBytes),url:video.url})).join('');
  $('#videos').innerHTML = `<div class="table-frame desktop-only"><div class="table-scroll"><table><thead><tr><th>File</th><th>Created</th><th>Duration</th><th>Size</th><th></th></tr></thead><tbody>${videos.map((video,index) => `<tr><td class="mono">${escapeHtml(video.file)}</td><td class="numeric muted">${escapeHtml(fmtDate(video.createdAt))}</td><td>${escapeHtml(fmtDuration(video.durationSeconds))}</td><td class="muted">${escapeHtml(fmtBytes(video.sizeBytes))}</td><td><button class="text-button video-toggle" data-index="${index}">Play</button></td></tr><tr id="player-${index}" hidden><td colspan="5"><video controls preload="none" src="${escapeHtml(video.url)}"></video></td></tr>`).join('')}</tbody></table></div></div><div class="mobile-list">${mobileRows}</div>`;
  document.querySelectorAll('.video-toggle').forEach(button => button.addEventListener('click', () => { const row = $(`#player-${button.dataset.index}`); row.hidden = !row.hidden; button.textContent = row.hidden ? 'Play' : 'Hide'; }));
}
function handleExecutionRefreshError(error) {
  if (executionRows.length) {
    $('#executionCount').textContent = `${executionRows.length} loaded · refresh delayed`;
    return;
  }
  $('#runningCount').textContent = 'Unable to refresh';
  $('#running').innerHTML = '<div class="empty">Live node data is temporarily unavailable.</div>';
  $('#executions').innerHTML = `<div class="empty">Execution history could not load: ${escapeHtml(error.message)}</div>`;
}
async function refresh() {
  await Promise.allSettled([
    loadStatus().catch(() => { $('#lastUpdated').textContent = 'Service status unavailable'; }),
    loadSchedule(),
    loadExecutions(true).catch(handleExecutionRefreshError),
    loadVideos(),
  ]);
}
refresh();
setInterval(() => {
  loadStatus().catch(() => { $('#lastUpdated').textContent = 'Service status refresh delayed'; });
  loadSchedule();
  loadExecutions(true).catch(handleExecutionRefreshError);
}, 30_000);
setInterval(() => { renderNextRun(); document.querySelectorAll('[data-started]').forEach(element => { element.textContent = durationBetween(element.dataset.started); }); }, 1_000);
</script>
</body>
