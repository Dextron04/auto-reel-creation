<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reel Automation Dashboard</title>
<style>
  :root{
    --bg:#0b0d12; --panel:#12151c; --panel-2:#171b24; --border:#232836;
    --text:#e7e9ee; --muted:#8b93a7; --accent:#6ea8fe; --good:#3ecf8e;
    --bad:#f45b69; --warn:#f5b942; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px 16px 64px}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  @media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .tile .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .tile .value{font-size:22px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  .dot.good{background:var(--good);box-shadow:0 0 8px var(--good)}
  .dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
  .dot.warn{background:var(--warn)}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .panel h2{font-size:14px;margin:0 0 14px;color:var(--text);display:flex;align-items:center;justify-content:space-between}
  .panel h2 small{color:var(--muted);font-weight:400}
  .banner{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:10px;display:flex;gap:8px}
  .banner.bad{background:rgba(244,91,105,.1);border:1px solid rgba(244,91,105,.3)}
  .banner.warn{background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.3)}
  .banner.info{background:rgba(110,168,254,.1);border:1px solid rgba(110,168,254,.3)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid var(--border)}
  td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
  tr:last-child td{border-bottom:none}
  .muted{color:var(--muted)}
  .mono{font-family:var(--mono)}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
  .pill.ok{background:rgba(62,207,142,.15);color:var(--good)}
  .pill.err{background:rgba(244,91,105,.15);color:var(--bad)}
  .pill.running{background:rgba(110,168,254,.15);color:var(--accent)}
  .empty{color:var(--muted);font-size:13px;padding:8px 0}
  .schedule-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  input[type=text]{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-family:var(--mono);font-size:13px;width:220px}
  button{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 12px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#0b0d12;border-color:var(--accent);font-weight:600}
  .preset{font-size:12px;padding:5px 10px}
  #scheduleMsg{font-size:13px;margin-top:8px}
  video{width:100%;max-width:340px;border-radius:8px;display:block;margin-top:6px}
  .video-toggle{color:var(--accent);cursor:pointer;font-size:12px;background:none;border:none;padding:0}
  .gate-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
  .gate-row:last-child{border-bottom:none}
  .gate-check{flex:none;width:18px;text-align:center}
  .gate-title{font-weight:500}
  .gate-evidence{color:var(--muted);font-size:12px;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Reel Automation Dashboard</h1>
  <div class="sub" id="lastUpdated">Loading…</div>

  <div class="grid" id="tiles"></div>

  <div id="banners"></div>

  <div class="panel">
    <h2>Release Schedule</h2>
    <div class="schedule-row">
      <button class="preset" data-cron="0 9,17 * * *">Twice daily (9am/5pm)</button>
      <button class="preset" data-cron="0 9 * * *">Once daily (9am)</button>
      <button class="preset" data-cron="0 */6 * * *">Every 6 hours</button>
      <button class="preset" data-cron="0 */4 * * *">Every 4 hours</button>
    </div>
    <div class="schedule-row">
      <input type="text" id="cronInput" class="mono" placeholder="0 9,17 * * *" />
      <button class="primary" id="saveSchedule">Save</button>
      <span class="muted" id="scheduleSource"></span>
    </div>
    <div id="scheduleMsg"></div>
  </div>

  <div class="panel">
    <h2>Recent Errors &amp; Executions <small id="execSource"></small></h2>
    <div id="executions"><div class="empty">Loading…</div></div>
  </div>

  <div class="panel">
    <h2>Pipeline Gates <small>from GATES.md</small></h2>
    <div id="gates"><div class="empty">Loading…</div></div>
  </div>

  <div class="panel">
    <h2>Released Videos <small id="videoCount"></small></h2>
    <div id="videos"><div class="empty">Loading…</div></div>
  </div>
</div>

<script>
const $ = (sel, el = document) => el.querySelector(sel);
const fmtBytes = n => n == null ? '—' : (n / 1024 / 1024).toFixed(1) + ' MB';
const fmtDate = s => s ? new Date(s).toLocaleString() : '—';
const fmtDuration = s => s == null ? '—' : `${s.toFixed(1)}s`;

async function getJSON(url, opts) {
  const res = await fetch(url, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || res.statusText), {body});
  return body;
}

function tile(label, valueHtml) {
  return `<div class="tile"><div class="label">${label}</div><div class="value">${valueHtml}</div></div>`;
}

async function loadStatus() {
  const s = await getJSON('/api/status');
  const tiles = [];
  tiles.push(tile('Renderer', `<span class="dot ${s.renderer.ok ? 'good' : 'bad'}"></span>${s.renderer.ok ? 'Online' : 'Offline'}`));
  tiles.push(tile('n8n', `<span class="dot ${s.n8n.ok ? 'good' : 'bad'}"></span>${s.n8n.ok ? 'Online' : 'Offline'}`));
  const wf = s.n8n.workflow;
  tiles.push(tile('Workflow', wf ? `<span class="dot ${wf.active ? 'good' : 'warn'}"></span>${wf.active ? 'Active' : 'Paused'}` : `<span class="dot warn"></span>Unknown`));
  tiles.push(tile('API Key', `<span class="dot ${s.n8n.apiConfigured ? 'good' : 'warn'}"></span>${s.n8n.apiConfigured ? 'Connected' : 'Not set'}`));
  $('#tiles').innerHTML = tiles.join('');

  const banners = $('#banners');
  banners.innerHTML = '';
  for (const w of s.envWarnings ?? []) {
    const level = w.level ?? 'warn';
    banners.innerHTML += `<div class="banner ${level}">${w.message}</div>`;
  }
  if (s.n8n.error) banners.innerHTML += `<div class="banner bad">n8n API error: ${s.n8n.error}</div>`;

  $('#lastUpdated').textContent = 'Last updated ' + new Date().toLocaleTimeString();
}

async function loadSchedule() {
  try {
    const s = await getJSON('/api/schedule');
    $('#cronInput').value = s.cron ?? '';
    $('#scheduleSource').textContent = s.source === 'n8n' ? `live from n8n${s.active === false ? ' (workflow paused)' : ''}` : 'from checked-in workflow file (n8n API not connected)';
  } catch (error) {
    $('#scheduleSource').textContent = '';
    $('#scheduleMsg').innerHTML = `<span style="color:var(--bad)">${error.message}</span>`;
  }
}

document.querySelectorAll('.preset').forEach(btn => {
  btn.addEventListener('click', () => { $('#cronInput').value = btn.dataset.cron; });
});

$('#saveSchedule').addEventListener('click', async () => {
  const cron = $('#cronInput').value.trim();
  const msg = $('#scheduleMsg');
  msg.textContent = 'Saving…';
  try {
    const result = await getJSON('/api/schedule', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({cron}),
    });
    msg.innerHTML = `<span style="color:var(--good)">Schedule updated to <span class="mono">${cron}</span>.</span>` + (result.fileWarning ? `<br><span style="color:var(--warn)">${result.fileWarning}</span>` : '');
    loadStatus();
  } catch (error) {
    msg.innerHTML = `<span style="color:var(--bad)">${error.message}</span>`;
  }
});

async function loadExecutions() {
  const box = $('#executions');
  const data = await getJSON('/api/executions');
  if (!data.configured) {
    box.innerHTML = `<div class="empty">Connect N8N_API_KEY in .env.prod to see execution history.</div>`;
    return;
  }
  if (data.error) { box.innerHTML = `<div class="empty">n8n API error: ${data.error}</div>`; return; }
  if (!data.recent.length) { box.innerHTML = `<div class="empty">No executions yet.</div>`; return; }
  const errCount = data.recent.filter(e => e.status === 'error').length;
  $('#execSource').textContent = `— ${errCount} error(s) in last ${data.recent.length}`;
  box.innerHTML = `<table><thead><tr><th>Status</th><th>Started</th><th>Node</th><th>Message</th></tr></thead><tbody>
    ${data.recent.map(e => `<tr>
      <td><span class="pill ${e.status === 'success' ? 'ok' : e.status === 'error' ? 'err' : 'running'}">${e.status}</span></td>
      <td class="muted">${fmtDate(e.startedAt)}</td>
      <td class="mono">${e.failedNode ?? '—'}</td>
      <td>${e.error ?? '—'}</td>
    </tr>`).join('')}
  </tbody></table>`;
}

async function loadGates() {
  const box = $('#gates');
  const gates = await getJSON('/api/gates');
  if (!gates.length) { box.innerHTML = `<div class="empty">No gates found.</div>`; return; }
  box.innerHTML = gates.map(g => `
    <div class="gate-row">
      <div class="gate-check" style="color:${g.done ? 'var(--good)' : 'var(--bad)'}">${g.done ? '✓' : '✗'}</div>
      <div>
        <div class="gate-title">${g.id}: ${g.title}</div>
        ${g.evidence ? `<div class="gate-evidence">${g.evidence}</div>` : ''}
      </div>
    </div>`).join('');
}

async function loadVideos() {
  const box = $('#videos');
  const videos = await getJSON('/api/videos');
  $('#videoCount').textContent = `— ${videos.length} released`;
  if (!videos.length) { box.innerHTML = `<div class="empty">No rendered videos in output/ yet.</div>`; return; }
  box.innerHTML = `<table><thead><tr><th>File</th><th>Created</th><th>Duration</th><th>Captions</th><th>Visuals</th><th>Size</th><th></th></tr></thead><tbody>
    ${videos.map((v, i) => `<tr>
      <td class="mono">${v.file}</td>
      <td class="muted">${fmtDate(v.createdAt)}</td>
      <td>${fmtDuration(v.durationSeconds)}</td>
      <td>${v.captionCount ?? '—'}</td>
      <td>${v.visualCount ?? '—'}</td>
      <td class="muted">${fmtBytes(v.sizeBytes)}</td>
      <td><button class="video-toggle" data-i="${i}">▶ Play</button></td>
    </tr>
    <tr id="player-${i}" style="display:none"><td colspan="7"><video controls preload="none" src="${v.url}"></video></td></tr>`).join('')}
  </tbody></table>`;
  box.querySelectorAll('.video-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const row = $('#player-' + btn.dataset.i);
      row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
    });
  });
}

function refreshAll() {
  loadStatus().catch(console.error);
  loadSchedule().catch(console.error);
  loadExecutions().catch(console.error);
  loadGates().catch(console.error);
  loadVideos().catch(console.error);
}

refreshAll();
setInterval(refreshAll, 30000);
</script>
</body>
</html>
